<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/sonus-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Security Policies (Anti-Hacker) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net https://challenges.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; connect-src 'self' https: http: wss:; frame-src 'self' https://www.youtube.com https://www.googletagmanager.com https://challenges.cloudflare.com;">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">

    <!-- Analytics (GTM + Meta Pixel): filas criadas na hora; scripts de terceiros carregados fora do caminho crítico.
         PageViews de rotas SPA são disparados pelo AnalyticsTracker (React) — veja src/lib/pageTracking.ts -->
    <script>
    (function(w,d){
      // GTM: dataLayer e evento gtm.start imediatos (nada se perde: o GTM reprocessa a fila ao carregar)
      w.dataLayer = w.dataLayer || [];
      w.dataLayer.push({'gtm.start': new Date().getTime(), event: 'gtm.js'});

      // Meta Pixel: stub + fila (fbevents.js reprocessa a fila quando carregar)
      if (!w.fbq) {
        var n = w.fbq = function(){ n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments) };
        if (!w._fbq) w._fbq = n;
        n.push = n; n.loaded = true; n.version = '2.0'; n.queue = [];
      }
      // SPA: o React Router controla os PageViews. Desliga o rastreio automático de pushState do Pixel
      // (que só passaria a existir depois do fbevents.js carregar) para não duplicar nem perder rotas.
      w.fbq.disablePushState = true;
      w.fbq.allowDuplicatePageViews = true;
      w.fbq('init', '1711783468822151');
      w.fbq('track', 'PageView'); // PageView da carga inicial

      function inject(src) {
        var j = d.createElement('script');
        j.async = true; j.src = src;
        d.head.appendChild(j);
      }
      var done = false;
      function loadThirdParty() {
        if (done) return; done = true;
        inject('https://www.googletagmanager.com/gtm.js?id=GTM-MXM6D6XR');
        inject('https://connect.facebook.net/en_US/fbevents.js');
      }
      // Exposto para o AnalyticsTracker: a 1ª troca de rota carrega os scripts imediatamente
      w.__sonusLoadThirdParty = loadThirdParty;

      function schedule() {
        if ('requestIdleCallback' in w) w.requestIdleCallback(loadThirdParty, { timeout: 1000 });
        else setTimeout(loadThirdParty, 1000);
      }
      // Após o load da página; ou antes, na 1ª interação / 1ª troca de rota
      if (d.readyState === 'complete') schedule(); else w.addEventListener('load', schedule, { once: true });
      ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(function(ev) {
        w.addEventListener(ev, loadThirdParty, { once: true, passive: true });
      });
    })(window, document);
    </script>
    <!-- End Analytics -->
    <!-- Fontes carregadas normalmente para evitar CLS (Cumulative Layout Shift) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"></noscript>
    
    <!-- LCP Optimization foi removida para não bloquear o JavaScript (Head-of-Line blocking em 3G/4G) -->
    
    </head>
  <body class="bg-white dark:bg-[#050505] overflow-x-hidden">
    <!-- Meta Pixel Code (noscript) -->
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1711783468822151&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code (noscript) -->
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MXM6D6XR"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <style>
      body { margin: 0; }
      .initial-loader-container {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        display: flex; align-items: center; justify-content: center;
        background-color: #000000; z-index: 9999;
      }
      .initial-loader {
        width: 32px; height: 32px; border: 2px solid #2980b9;
        border-top-color: transparent; border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <div id="root">
      <div class="initial-loader-container"><div class="initial-loader"></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
